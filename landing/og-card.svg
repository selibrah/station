<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Station — 0.36ms Rust Browser Daemon, Native MCP Server &amp; macOS Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="100%" stop-color="#0E1524"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.74" cy="0.48" r="0.38">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#2DD4BF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#lens)"/>

  <!-- Architectural Grid Lines -->
  <line x1="64" y1="0" x2="64" y2="630" stroke="#1D2638" stroke-width="1"/>
  <line x1="1136" y1="0" x2="1136" y2="630" stroke="#1D2638" stroke-width="1"/>
  <line x1="0" y1="88" x2="1200" y2="88" stroke="#1D2638" stroke-width="1"/>
  <line x1="0" y1="548" x2="1200" y2="548" stroke="#1D2638" stroke-width="1"/>

  <!-- Kinetic ASCII Field Illustration on Right -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <text x="690" y="160" fill="#334155">&lt;div&gt; ::script {hydrate} &lt;span&gt; .cls</text>
    <text x="660" y="192" fill="#475569">;; /* dom_bloat 48,210 tok */ &lt;svg&gt;</text>
    <text x="710" y="232" fill="#38BDF8" font-weight="600">[@e1] input "Search roles"  0.36ms</text>
    <text x="695" y="264" fill="#2DD4BF" font-weight="600">[@e2] file  "resume.pdf"    READY</text>
    <text x="710" y="296" fill="#38BDF8" font-weight="600">[@e3] btn   "Save Match"    94 PTS</text>
    <text x="680" y="336" fill="#2DD4BF">✓ housing: 58 · jobs: 30 · -99.4% tok</text>
    <text x="660" y="376" fill="#475569">&lt;/div&gt; __NEXT_DATA__ {chunk: 8192}</text>
    <text x="700" y="408" fill="#334155">::after &lt;iframe&gt; [aria-hidden=true]</text>
  </g>
  <circle cx="855" cy="276" r="142" fill="none" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- Left Typography -->
  <text x="96" y="60" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600">STATION v0.4 · RUST NATIVE CDP + MCP + MACOS STUDIO</text>

  <text x="96" y="205" fill="#F2F5FA" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="700" letter-spacing="-2.2">0.36 ms to your</text>
  <text x="96" y="280" fill="#F2F5FA" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="700" letter-spacing="-2.2">logged-in Chrome.</text>

  <text x="96" y="344" fill="#8E9BB0" font-family="system-ui, -apple-system, sans-serif" font-size="25">Zero browser extensions. Zero API keys. 2,600 ops/sec.</text>
  <text x="96" y="382" fill="#8E9BB0" font-family="system-ui, -apple-system, sans-serif" font-size="25">Built-in Auto-Jobs, SQLite CRM &amp; Swift Charts.</text>

  <rect x="96" y="432" width="530" height="54" rx="8" fill="#0E131D" stroke="#26334D"/>
  <text x="118" y="465" fill="#2DD4BF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">$ claude mcp add station -- station mcp --auto-start</text>

  <text x="96" y="594" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">github.com/selibrah/station · OpenCLI &amp; Agent-Reach Alternative</text>
