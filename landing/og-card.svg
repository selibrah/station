<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Station — 0.36ms Rust Browser Daemon &amp; Native MCP Server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C1017"/>
      <stop offset="100%" stop-color="#131B28"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.55"/>

  <rect x="64" y="64" width="250" height="38" rx="19" fill="#0F2922" stroke="#10B981" stroke-opacity="0.45"/>
  <circle cx="88" cy="83" r="6" fill="#10B981"/>
  <text x="104" y="89" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600">0.36 ms CDP · 4.5 MB RAM</text>

  <text x="64" y="182" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5">Station</text>
  <text x="64" y="246" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="500">Your logged-in Chrome as a sub-millisecond CLI &amp; MCP server.</text>
  <text x="64" y="294" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="24">Zero browser extensions. Zero API keys. Built in Rust with native macOS Studio.</text>

  <!-- Benchmark Bars -->
  <rect x="64" y="352" width="1072" height="214" rx="16" fill="#0F1623" stroke="#263244"/>
  <text x="96" y="396" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="600">Station (Rust CDP)       0.36 ms</text>
  <rect x="470" y="380" width="16" height="20" rx="4" fill="#10B981"/>

  <text x="96" y="446" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">OpenCLI (Node + Ext)    28–310 ms</text>
  <rect x="470" y="430" width="420" height="20" rx="4" fill="#475569"/>

  <text x="96" y="496" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Playwright Headless     180+ ms (logged out)</text>
  <rect x="470" y="480" width="310" height="20" rx="4" fill="#475569"/>

  <text x="96" y="540" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">claude mcp add station -- station mcp --auto-start</text>
</svg>
