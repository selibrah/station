[package]
name = "station"
version = "0.4.0"
edition = "2021"
description = "Site-agnostic browser automation daemon & native MCP server over the Chrome DevTools Protocol"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = "0.7"
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
base64 = "0.22"
